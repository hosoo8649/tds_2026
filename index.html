<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>eSignon 완료 UI 타입 테스트 v40.94</title>
  <style>
    :root {
      --blue-50: #eaf6ff;
      --blue-500: #0088ff;
      --blue-600: #0076e6;
      --green-500: #34c759;
      --green-600: #2eb350;
      --gray-50: #f9fafb;
      --gray-100: #f2f4f6;
      --gray-200: #e5e8eb;
      --gray-300: #d1d6db;
      --gray-400: #b0b8c1;
      --gray-500: #8b95a1;
      --gray-600: #6b7684;
      --gray-700: #4e5968;
      --gray-900: #191f28;
      --surface: #ffffff;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --visual-viewport-height: 100dvh;
      --visual-viewport-offset-top: 0px;
      --sheet-max-height: 90dvh;
      --font: "Pretendard GOV", "Pretendard", "Apple SD Gothic Neo", -apple-system,
        BlinkMacSystemFont, system-ui, sans-serif;
    }

    * { box-sizing: border-box; font-family: var(--font); letter-spacing: -0.2px; }
    html, body { width: 100%; height: 100%; margin: 0; overscroll-behavior: none; }
    body { overflow: hidden; color: var(--gray-900); background: var(--gray-100); }
    button, a, textarea { font: inherit; }
    button { appearance: none; }

    .test-screen {
      width: 100%; height: 100%; display: flex; align-items: center;
      justify-content: center; padding: 24px;
    }
    .test-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .test-action {
      min-width: 180px; height: 48px; padding: 0 24px; border: 0;
      border-radius: var(--radius-xl); background: var(--green-500); color: var(--surface);
      font-size: 16px; line-height: 1.5; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .test-action:hover { background: var(--green-600); }
    .test-action:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

    .completion-message {
      display: none; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    }
    .completion-message.is-visible { display: flex; }
    .completion-message strong { font-size: 22px; line-height: 1.5; }
    .completion-message p { margin: 0; color: var(--gray-600); font-size: 16px; line-height: 1.5; }

    .overlay {
      position: fixed; inset: 0; z-index: 100; display: none; align-items: center;
      justify-content: center; padding: 16px; background: rgba(2, 9, 19, 0.48);
    }
    .overlay.is-open { display: flex; }
    .dialog {
      width: calc(100% - 32px); max-width: 480px; max-height: calc(100vh - 32px);
      overflow-y: auto; border-radius: var(--radius-xl); background: var(--surface);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18); padding: 24px;
      animation: dialog-in 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .sheet-handle { display: none; }
    .dialog-title {
      margin: 0; font-size: 22px; line-height: 1.5; font-weight: 700; white-space: pre-line;
    }
    .dialog-subtitle {
      margin: 8px 0 0; color: var(--gray-600); font-size: 16px; line-height: 1.5;
    }
    .dialog-body { margin-top: 24px; }
    .dialog-footer { margin-top: 24px; display: flex; justify-content: flex-end; gap: 8px; }

    .notice-box {
      width: 100%; border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
      background: var(--gray-50); overflow: hidden;
    }
    .notice-content { padding: 16px; }
    .consent-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .consent-items li {
      display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 8px;
      color: var(--gray-700); font-size: 14px; line-height: 1.5; word-break: keep-all;
    }
    .consent-item-icon {
      width: 20px; height: 20px; margin-top: 1px; color: var(--blue-500); fill: none;
      stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .consent-items a { color: var(--blue-500); font-weight: 600; }
    .consent-items a:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

    .recipient-message { margin-top: 16px; border-top: 1px solid var(--gray-200); }
    .recipient-message.is-only { margin-top: 0; border-top: 0; }
    .message-toggle {
      width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent;
      color: var(--gray-900); display: flex; align-items: center; gap: 8px; text-align: left;
      font-size: 14px; line-height: 1.5; font-weight: 600; cursor: pointer;
    }
    .message-icon {
      width: 20px; height: 20px; flex: 0 0 auto; color: var(--gray-600); fill: none;
      stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .message-label { min-width: 0; }
    .optional-badge {
      flex: 0 0 auto; padding: 2px 6px; border-radius: 6px; background: var(--gray-100);
      color: var(--gray-600); font-size: 12px; line-height: 1.5; font-weight: 500;
    }
    .chevron {
      width: 20px; height: 20px; margin-left: auto; flex: 0 0 auto; color: var(--gray-500);
      fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
      stroke-linejoin: round; transition: transform 160ms ease;
    }
    .message-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .message-toggle:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; border-radius: 8px; }
    .message-panel { margin: 0 -4px; padding: 8px 4px 4px; }
    .message-panel[hidden] { display: none; }
    .next-target { margin-bottom: 12px; }
    .next-target-label {
      margin: 0 0 4px; color: var(--gray-600); font-size: 12px; line-height: 1.5; font-weight: 500;
    }
    .next-target-summary {
      margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--gray-900); font-size: 14px; line-height: 1.5; font-weight: 600;
    }
    .message-input-wrap {
      position: relative;
      border: 1px solid var(--gray-300); border-radius: var(--radius-lg); background: var(--surface);
      overflow: hidden; transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .message-input-wrap:focus-within {
      border-color: var(--blue-500); box-shadow: 0 0 0 3.5px rgba(0, 136, 255, 0.14);
    }
    .message-input {
      display: block; width: 100%; height: 48px; min-height: 48px; max-height: 108px; resize: none;
      border: 0; outline: 0; padding: 12px 64px 12px 16px; color: var(--gray-900);
      background: transparent; font-size: 14px; line-height: 1.5; overflow-y: hidden;
    }
    .message-input::placeholder { color: var(--gray-400); }
    .message-count {
      position: absolute; right: 16px; bottom: 12px; color: var(--gray-500);
      font-size: 12px; line-height: 1.5; pointer-events: none;
    }

    .dialog-button {
      height: 48px; border: 0; border-radius: var(--radius-xl); padding: 0 20px;
      font-size: 16px; line-height: 1.5; font-weight: 700; cursor: pointer;
    }
    .dialog-button.secondary { min-width: 80px; background: var(--gray-100); color: var(--gray-900); }
    .dialog-button.primary { min-width: 104px; background: var(--blue-500); color: var(--surface); }
    .dialog-button.primary:hover { background: var(--blue-600); }
    .dialog-button:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 2px; }

    @media (max-width: 1023px) {
      .test-action { width: 100%; max-width: 360px; height: 56px; }
      .test-actions { width: 100%; flex-direction: column; align-items: center; }
      .overlay {
        inset: auto 0 auto 0;
        top: var(--visual-viewport-offset-top, 0px);
        width: 100%;
        height: var(--visual-viewport-height, 100dvh);
        align-items: flex-end;
        padding: 0;
        background: rgba(0, 0, 0, 0.45);
      }
      .dialog {
        width: 100%; max-width: none; max-height: var(--sheet-max-height, 90dvh);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 0;
        box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.16); overflow: hidden;
        display: flex; flex-direction: column;
      }
      .sheet-handle {
        height: 20px; display: flex; align-items: flex-start; justify-content: center; padding-top: 16px;
        flex: 0 0 auto;
      }
      .sheet-handle::before {
        content: ""; width: 48px; height: 4px; flex: 0 0 auto; border-radius: 2px;
        background: var(--gray-200);
      }
      .dialog-header { padding: 16px 16px 0; margin-bottom: 16px; flex: 0 0 auto; }
      .dialog-title { font-size: 20px; line-height: 1.4; }
      .dialog-subtitle { margin-top: 6px; padding-bottom: 0; }
      .dialog-body {
        margin-top: 0; padding: 0 16px; min-height: 0;
        flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .recipient-message { margin-top: 12px; }
      .dialog-footer {
        margin-top: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
        background: var(--surface); flex: 0 0 auto;
      }
      .dialog.keyboard-open .dialog-footer { padding-bottom: 12px; }
      .dialog-button { height: 56px; flex: 1; padding: 0 12px; }
      .message-input {
        font-size: 16px; line-height: 1.5; padding-top: 12px; padding-bottom: 12px;
      }
      .message-toggle, .dialog-button { touch-action: manipulation; }
    }

    @keyframes dialog-in {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dialog { animation: none; }
      .chevron { transition: none; }
    }
  </style>
</head>
<body>
  <main class="test-screen">
    <div id="testActions" class="test-actions">
      <button class="test-action" type="button" data-completion-type="sign">서명 요청 완료 화면</button>
    </div>

    <section id="completionMessage" class="completion-message" aria-live="polite">
      <strong id="completionTitle">서명이 완료되었습니다.</strong>
      <p id="completionDescription">완료 처리가 정상적으로 끝났습니다.</p>
      <button id="retryButton" class="test-action" type="button">다시 테스트</button>
    </section>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <section id="completionDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="dialog-header">
        <h1 id="dialogTitle" class="dialog-title">전자서명 완료를 위해<br />아래 내용에 동의해 주세요</h1>
        <p id="dialogSubtitle" class="dialog-subtitle" hidden></p>
      </header>

      <div id="dialogBody" class="dialog-body">
        <div id="noticeBox" class="notice-box" role="note" aria-label="전자서명 동의 항목">
          <div class="notice-content">
            <ul class="consent-items">
              <li>
                <svg class="consent-item-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3.75 10.25 8 14.5 16.25 5.75" />
                </svg>
                <span>문서 내용을 확인했으며, 입력한 내용과 서명을 본인의 전자서명으로 사용하는 데 동의합니다.</span>
              </li>
              <li>
                <svg class="consent-item-icon" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M3.75 10.25 8 14.5 16.25 5.75" />
                </svg>
                <span>
                  <a href="https://esignon.co.kr/terms" target="_blank" rel="noreferrer">전자서명 이용약관</a>에 동의하며
                  <a href="https://esignon.co.kr/privacy" target="_blank" rel="noreferrer">개인정보처리방침</a>을 확인했습니다.
                </span>
              </li>
            </ul>
          </div>
        </div>

        <section id="recipientMessage" class="recipient-message" aria-labelledby="messageToggleLabel">
          <button id="messageToggle" class="message-toggle" type="button" aria-expanded="false" aria-controls="messagePanel">
            <svg class="message-icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4.25 4.75h11.5v8.5H9l-3.75 2.5v-2.5h-1z" />
            </svg>
            <span id="messageToggleLabel" class="message-label">메시지 남기기</span>
            <span class="optional-badge">선택</span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true">
              <path d="m5.75 7.75 4.25 4.25 4.25-4.25" />
            </svg>
          </button>
          <div id="messagePanel" class="message-panel" hidden>
            <div class="next-target" aria-label="다음 수신인 정보">
              <p class="next-target-label">다음 수신인</p>
              <p id="nextTargetSummary" class="next-target-summary">김민지 (minji.kim@example.com)</p>
            </div>
            <div class="message-input-wrap">
              <textarea id="messageInput" class="message-input" maxlength="120" placeholder="전달할 메시지를 입력해 주세요."></textarea>
              <div class="message-count"><span id="messageCount">0</span>/120</div>
            </div>
          </div>
        </section>
      </div>

      <footer class="dialog-footer">
        <button id="cancelButton" class="dialog-button secondary" type="button">취소</button>
        <button id="completeButton" class="dialog-button primary" type="button">동의하고 완료하기</button>
      </footer>
    </section>
  </div>

  <script>
    const completionTypes = {
      sign: {
        title: "전자서명 완료를 위해\n아래 내용에 동의해 주세요",
        subtitle: "",
        action: "동의하고 완료하기",
        successTitle: "서명이 완료되었습니다.",
        successDescription: "서명 완료 상태와 메시지가 다음 수신인에게 전달되었습니다.",
        showNotice: true,
        showMessageOption: true,
        nextTarget: {
          name: "김민지",
          contact: "minji.kim@example.com"
        }
      },
      review: {
        title: "문서 검토",
        subtitle: "문서 내용을 확인한 후 검토를 완료해 주세요.",
        action: "검토 완료하기",
        successTitle: "검토가 완료되었습니다.",
        successDescription: "검토 완료 상태와 메시지가 다음 수신인에게 전달되었습니다.",
        showNotice: false,
        showMessageOption: true,
        nextTarget: {
          name: "(주)제이씨원",
          contact: "sign@jc1.co.kr"
        }
      }
    };

    const testActions = document.getElementById("testActions");
    const openButtons = document.querySelectorAll("[data-completion-type]");
    const retryButton = document.getElementById("retryButton");
    const overlay = document.getElementById("overlay");
    const completionDialog = document.getElementById("completionDialog");
    const dialogTitle = document.getElementById("dialogTitle");
    const dialogSubtitle = document.getElementById("dialogSubtitle");
    const dialogBody = document.getElementById("dialogBody");
    const noticeBox = document.getElementById("noticeBox");
    const recipientMessage = document.getElementById("recipientMessage");
    const messageToggle = document.getElementById("messageToggle");
    const messagePanel = document.getElementById("messagePanel");
    const nextTargetSummary = document.getElementById("nextTargetSummary");
    const messageInput = document.getElementById("messageInput");
    const messageCount = document.getElementById("messageCount");
    const cancelButton = document.getElementById("cancelButton");
    const completeButton = document.getElementById("completeButton");
    const completionMessage = document.getElementById("completionMessage");
    const completionTitle = document.getElementById("completionTitle");
    const completionDescription = document.getElementById("completionDescription");
    const mobileMedia = window.matchMedia("(max-width: 1023px)");
    const visualViewport = window.visualViewport;
    let stableViewportHeight = visualViewport ? visualViewport.height : window.innerHeight;
    let viewportFrame = 0;
    let activeType = "sign";
    let currentTrigger = openButtons[0];

    function isMessageFocused() {
      return document.activeElement === messageInput;
    }

    function keepMessageInputVisible() {
      if (!mobileMedia.matches || !isMessageFocused() || messagePanel.hidden) return;
      const bodyRect = dialogBody.getBoundingClientRect();
      const inputRect = messageInput.parentElement.getBoundingClientRect();
      const bottomGap = 8;

      if (inputRect.bottom > bodyRect.bottom - bottomGap) {
        dialogBody.scrollTop += inputRect.bottom - bodyRect.bottom + bottomGap;
      } else if (inputRect.top < bodyRect.top + bottomGap) {
        dialogBody.scrollTop -= bodyRect.top - inputRect.top + bottomGap;
      }
    }

    function updateMobileViewport() {
      cancelAnimationFrame(viewportFrame);
      viewportFrame = requestAnimationFrame(() => {
        const viewportHeight = visualViewport ? visualViewport.height : window.innerHeight;
        const viewportOffsetTop = visualViewport ? visualViewport.offsetTop : 0;

        if (!isMessageFocused()) stableViewportHeight = viewportHeight;

        const keyboardReduction = Math.max(0, stableViewportHeight - viewportHeight);
        const keyboardOpen = mobileMedia.matches && isMessageFocused() && keyboardReduction > 120;
        const sheetHeight = keyboardOpen ? viewportHeight : viewportHeight * 0.9;

        document.documentElement.style.setProperty("--visual-viewport-height", `${Math.round(viewportHeight)}px`);
        document.documentElement.style.setProperty("--visual-viewport-offset-top", `${Math.round(viewportOffsetTop)}px`);
        document.documentElement.style.setProperty("--sheet-max-height", `${Math.round(sheetHeight)}px`);
        completionDialog.classList.toggle("keyboard-open", keyboardOpen);

        if (keyboardOpen) requestAnimationFrame(keepMessageInputVisible);
      });
    }

    function resetMessage() {
      messageToggle.setAttribute("aria-expanded", "false");
      messagePanel.hidden = true;
      messageInput.value = "";
      messageInput.style.height = "48px";
      messageInput.style.overflowY = "hidden";
      messageCount.textContent = "0";
    }

    function openDialog(type = activeType, trigger = currentTrigger) {
      const config = completionTypes[type] || completionTypes.sign;
      activeType = type;
      currentTrigger = trigger;
      resetMessage();
      dialogTitle.textContent = config.title;
      dialogSubtitle.textContent = config.subtitle;
      dialogSubtitle.hidden = !config.subtitle;
      completionDialog.classList.toggle("has-subtitle", Boolean(config.subtitle));
      if (config.subtitle) completionDialog.setAttribute("aria-describedby", "dialogSubtitle");
      else completionDialog.removeAttribute("aria-describedby");
      completeButton.textContent = config.action;
      noticeBox.hidden = !config.showNotice;
      recipientMessage.hidden = !config.showMessageOption;
      recipientMessage.classList.toggle("is-only", !config.showNotice);
      const target = config.nextTarget || {};
      nextTargetSummary.textContent = target.contact
        ? `${target.name || "다음 수신인"} (${target.contact})`
        : target.name || "다음 수신인";
      nextTargetSummary.title = nextTargetSummary.textContent;
      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");
      updateMobileViewport();
      requestAnimationFrame(() => completeButton.focus());
    }

    function closeDialog() {
      if (isMessageFocused()) messageInput.blur();
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
      completionDialog.classList.remove("keyboard-open");
      currentTrigger.focus();
    }

    openButtons.forEach((button) => {
      button.addEventListener("click", () => openDialog(button.dataset.completionType, button));
    });
    retryButton.addEventListener("click", () => {
      completionMessage.classList.remove("is-visible");
      testActions.hidden = false;
      openDialog();
    });
    messageToggle.addEventListener("click", () => {
      const willOpen = messageToggle.getAttribute("aria-expanded") !== "true";
      messageToggle.setAttribute("aria-expanded", String(willOpen));
      messagePanel.hidden = !willOpen;
      if (willOpen) {
        requestAnimationFrame(() => {
          try { messageInput.focus({ preventScroll: true }); }
          catch (error) { messageInput.focus(); }
          updateMobileViewport();
          setTimeout(keepMessageInputVisible, 180);
        });
      } else if (isMessageFocused()) {
        messageInput.blur();
      }
    });
    messageInput.addEventListener("input", () => {
      messageCount.textContent = String(messageInput.value.length);
      messageInput.style.height = "48px";
      const nextHeight = Math.min(messageInput.scrollHeight, 108);
      messageInput.style.height = `${nextHeight}px`;
      messageInput.style.overflowY = messageInput.scrollHeight > 108 ? "auto" : "hidden";
      if (mobileMedia.matches) requestAnimationFrame(keepMessageInputVisible);
    });
    messageInput.addEventListener("focus", () => {
      updateMobileViewport();
      setTimeout(keepMessageInputVisible, 180);
    });
    messageInput.addEventListener("blur", () => setTimeout(updateMobileViewport, 120));
    cancelButton.addEventListener("click", closeDialog);
    completeButton.addEventListener("click", () => {
      if (isMessageFocused()) messageInput.blur();
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
      completionDialog.classList.remove("keyboard-open");
      const config = completionTypes[activeType];
      completionTitle.textContent = config.successTitle;
      completionDescription.textContent = messageInput.value.trim()
        ? config.successDescription
        : activeType === "sign"
          ? "서명 완료 상태가 다음 수신인에게 전달되었습니다."
          : "검토 완료 상태가 다음 수신인에게 전달되었습니다.";
      testActions.hidden = true;
      completionMessage.classList.add("is-visible");
      retryButton.focus();
    });
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closeDialog();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && overlay.classList.contains("is-open")) closeDialog();
    });
    if (visualViewport) {
      visualViewport.addEventListener("resize", updateMobileViewport);
      visualViewport.addEventListener("scroll", updateMobileViewport);
    }
    window.addEventListener("resize", updateMobileViewport);
    window.addEventListener("orientationchange", () => {
      stableViewportHeight = visualViewport ? visualViewport.height : window.innerHeight;
      setTimeout(updateMobileViewport, 120);
    });
    updateMobileViewport();
  </script>
</body>
</html>
